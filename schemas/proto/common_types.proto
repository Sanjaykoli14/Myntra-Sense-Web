syntax = "proto3";

package myntra.sense.telemetry.v1;

enum PlatformType {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_MOBILE_WEB = 3;
  PLATFORM_DESKTOP_WEB = 4;
}

enum NetworkType {
  NETWORK_UNSPECIFIED = 0;
  NETWORK_WIFI = 1;
  NETWORK_4G = 2;
  NETWORK_5G = 3;
  NETWORK_OFFLINE = 4;
}

message ClientContext {
  string user_id = 1;
  string session_id = 2;
  string device_id = 3;
  string app_version = 4;
  PlatformType platform = 5;
  NetworkType network = 6;
  string ip_address = 7;
  string user_agent = 8;
  string delivery_pincode = 9;
  int64 timestamp_ms = 10;
}

message GeoLocation {
  double latitude = 1;
  double longitude = 2;
  string city = 3;
  string state = 4;
  string pincode = 5;
}
